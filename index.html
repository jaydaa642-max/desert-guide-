<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>دليل البر - ملاحة بدون نت</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --card-2: #0f172a;
      --border: #24324d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #ea580c;
      --green: #16a34a;
      --blue: #0284c7;
      --purple: #7c3aed;
      --teal: #0d9488;
      --amber: #d97706;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      padding: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header {
      background: var(--accent);
      color: #fff;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 19px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    .status-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .status-title {
      font-size: 14px;
      font-weight: 700;
      color: #4ade80;
      margin-bottom: 4px;
    }

    .coords-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      color: var(--text);
      direction: ltr;
      display: inline-block;
    }

    .sub-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }

    .btn:active { transform: scale(0.99); opacity: 0.92; }

    .btn-green { background: var(--green); }
    .btn-blue { background: var(--blue); }
    .btn-purple { background: var(--purple); }
    .btn-orange { background: var(--accent); }
    .btn-teal { background: var(--teal); }
    .btn-dark { background: #1e293b; border: 1px solid var(--border); }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .saved-car-box {
      background: var(--card-2);
      border: 1px dashed #334155;
      border-radius: 10px;
      padding: 9px 12px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .saved-car-box.active {
      border-style: solid;
      border-color: #22c55e;
      color: #dcfce7;
      background: rgba(22, 163, 74, 0.12);
    }

    .nav-panel {
      background: var(--card);
      border: 1.5px solid var(--accent);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      display: none;
    }

    .nav-panel.show { display: block; }

    .direction-badge {
      display: inline-block;
      background: rgba(234, 88, 12, 0.2);
      border: 1px solid var(--accent);
      color: #fdba74;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .visual-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .arrow-box {
      width: 96px;
      height: 96px;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .arrow-icon {
      font-size: 38px;
      line-height: 1;
      color: #38bdf8;
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .arrow-label {
      font-size: 11px;
      color: var(--muted);
    }

    canvas#radar {
      background: #050b18;
      border: 1.5px solid #263554;
      border-radius: 50%;
    }

    .target-name {
      font-size: 18px;
      font-weight: 800;
      margin: 4px 0;
    }

    .target-note {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .distance-val {
      font-size: 24px;
      font-weight: 800;
      color: #4ade80;
    }

    .bearing-val {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .alert-banner {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 9px;
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid #22c55e;
      color: #86efac;
      font-size: 13px;
      font-weight: 700;
      display: none;
    }

    .alert-banner.show { display: block; }

    .mini-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .mini-btn {
      padding: 9px 10px;
      font-size: 13px;
      border-radius: 9px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">دليل البر - ملاحة بدون نت</div>

    <div class="status-box">
      <div class="status-title" id="gpsStatus">جاهز — اضغط تحديث موقعي الآن</div>
      <div class="coords-text" id="currentCoords">--.-----, --.-----</div>
      <div class="sub-meta" id="gpsAccuracy">الدقة: غير محددة</div>
    </div>

    <button class="btn btn-green" id="btnUpdateGps">تحديث موقعي الآن (GPS)</button>

    <button class="btn btn-blue" id="btnLiveTrack">التتبع الحي عند الحركة: متوقف (اضغطي للتشغيل)</button>

    <div class="row-2">
      <button class="btn btn-dark" id="btnSaveCar">حفظ موقع السيارة</button>
      <button class="btn btn-purple" id="btnGoCar">العودة للسيارة</button>
    </div>

    <div class="saved-car-box" id="savedCarInfo">لم يتم حفظ موقع سيارة أو مخيم بعد</div>

    <button class="btn btn-orange" data-preset="road">أقرب طريق</button>
    <button class="btn btn-blue" data-preset="station">أقرب محطة وقود</button>
    <button class="btn btn-teal" data-preset="safety">أقرب نقطة أمان</button>

    <div class="mini-actions">
      <button class="btn btn-dark mini-btn" id="btnCopyCoords">نسخ الإحداثيات الحالية</button>
      <button class="btn btn-dark mini-btn" id="btnClearCar">مسح موقع السيارة</button>
    </div>

    <div class="nav-panel" id="navPanel">
      <div class="direction-badge" id="directionBadge">الاتجاه: --</div>

      <div class="visual-row">
        <div class="arrow-box">
          <span class="arrow-icon" id="arrowIcon">↑</span>
          <span class="arrow-label">سهم الاتجاه</span>
        </div>
        <canvas id="radar" width="150" height="150"></canvas>
      </div>

      <div class="target-name" id="targetName">--</div>
      <div class="target-note" id="targetNote">--</div>
      <div class="distance-val" id="distanceVal">المسافة المباشرة: -- كم</div>
      <div class="bearing-val" id="bearingVal">زاوية الاتجاه: --°</div>
      <div class="alert-banner" id="alertBanner">أنتِ قريبة جدًا من الوجهة (أقل من 30 مترًا)!</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_CAR = "desert_guide_saved_car_v1";

    const PRESETS = {
      road: {
        name: "طريق الثمامة الرئيسي",
        note: "مسار رئيسي قريب من منطقة الثمامة",
        lat: 25.0550,
        lng: 46.7650
      },
      station: {
        name: "محطة الدريس - مخرج الثمامة",
        note: "وقود وبنشر",
        lat: 25.0985,
        lng: 46.7310
      },
      safety: {
        name: "نقطة تجمع وأمان الثمامة",
        note: "نقطة مرجعية آمنة",
        lat: 25.0320,
        lng: 46.7900
      }
    };

    let currentPos = null; // { lat, lng, accuracy, heading }
    let savedCar = loadSavedCar();
    let activeTarget = null; // { name, note, lat, lng }
    let watchId = null;
    let arrivalAlertShown = false;

    const gpsStatusEl = document.getElementById("gpsStatus");
    const currentCoordsEl = document.getElementById("currentCoords");
    const gpsAccuracyEl = document.getElementById("gpsAccuracy");
    const btnUpdateGps = document.getElementById("btnUpdateGps");
    const btnLiveTrack = document.getElementById("btnLiveTrack");
    const btnSaveCar = document.getElementById("btnSaveCar");
    const btnGoCar = document.getElementById("btnGoCar");
    const btnCopyCoords = document.getElementById("btnCopyCoords");
    const btnClearCar = document.getElementById("btnClearCar");
    const savedCarInfoEl = document.getElementById("savedCarInfo");
    const navPanelEl = document.getElementById("navPanel");
    const directionBadgeEl = document.getElementById("directionBadge");
    const arrowIconEl = document.getElementById("arrowIcon");
    const targetNameEl = document.getElementById("targetName");
    const targetNoteEl = document.getElementById("targetNote");
    const distanceValEl = document.getElementById("distanceVal");
    const bearingValEl = document.getElementById("bearingVal");
    const alertBannerEl = document.getElementById("alertBanner");

    const radarCanvas = document.getElementById("radar");
    const rCtx = radarCanvas.getContext("2d");

    function loadSavedCar() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_CAR);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (typeof parsed.lat === "number" && typeof parsed.lng === "number") {
          return parsed;
        }
      } catch (e) {}
      return null;
    }

    function persistSavedCar(carObj) {
      try {
        localStorage.setItem(STORAGE_KEY_CAR, JSON.stringify(carObj));
      } catch (e) {}
    }

    function renderSavedCarStatus() {
      if (savedCar) {
        savedCarInfoEl.classList.add("active");
        savedCarInfoEl.innerHTML = `السيارة محفوظة: <span dir="ltr">${savedCar.lat.toFixed(5)}, ${savedCar.lng.toFixed(5)}</span>`;
      } else {
        savedCarInfoEl.classList.remove("active");
        savedCarInfoEl.textContent = "لم يتم حفظ موقع سيارة أو مخيم بعد";
      }
    }

    function toRad(deg) { return (deg * Math.PI) / 180; }
    function toDeg(rad) { return (rad * 180) / Math.PI; }

    function distanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function calculateBearing(lat1, lng1, lat2, lng2) {
      const y = Math.sin(toRad(lng2 - lng1)) * Math.cos(toRad(lat2));
      const x =
        Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
        Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(toRad(lng2 - lng1));
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function getCardinalArabic(bearing) {
      const dirs = [
        ["شمال (N)", 0],
        ["شمال شرقي (NE)", 45],
        ["شرق (E)", 90],
        ["جنوب شرقي (SE)", 135],
        ["جنوب (S)", 180],
        ["جنوب غربي (SW)", 225],
        ["غرب (W)", 270],
        ["شمال غربي (NW)", 315]
      ];
      let best = dirs[0][0];
      let minDiff = 999;
      for (const [label, deg] of dirs) {
        const diff = Math.abs(((bearing - deg + 540) % 360) - 180);
        if (diff < minDiff) {
          minDiff = diff;
          best = label;
        }
      }
      return best;
    }

    function playArrivalBeep() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.value = 0.12;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 220);
      } catch (e) {}
    }

    // رسم الرادار: النقطة فقط (بدون خط أثر)
    function drawRadarDotOnly(bearingDeg, distMeters) {
      const w = radarCanvas.width;
      const h = radarCanvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const maxR = (w / 2) - 14;

      rCtx.clearRect(0, 0, w, h);

      // دوائر الرادار
      rCtx.strokeStyle = "#1e3a8a";
      rCtx.lineWidth = 1;
      [0.35, 0.7, 1].forEach((ratio) => {
        rCtx.beginPath();
        rCtx.arc(cx, cy, maxR * ratio, 0, Math.PI * 2);
        rCtx.stroke();
      });

      // المحاور الأربعة
      rCtx.beginPath();
      rCtx.moveTo(cx - maxR, cy);
      rCtx.lineTo(cx + maxR, cy);
      rCtx.moveTo(cx, cy - maxR);
      rCtx.lineTo(cx, cy + maxR);
      rCtx.stroke();

      // الحروف الأساسية
      rCtx.fillStyle = "#94a3b8";
      rCtx.font = "bold 11px sans-serif";
      rCtx.textAlign = "center";
      rCtx.fillText("ش", cx, 12);
      rCtx.fillText("ج", cx, h - 4);
      rCtx.fillText("ق", w - 8, cy + 4);
      rCtx.fillText("غ", 8, cy + 4);

      // تحويل المسافة والزاوية إلى موقع النقطة فقط داخل الرادار (كلما اقتربنا اقتربت النقطة من المركز)
      const normalizedDist = Math.min(distMeters / 2000, 1); // مقياس 2 كم داخل الرادار
      const rDot = normalizedDist * (maxR - 8);
      const rad = toRad(bearingDeg);
      const dotX = cx + Math.sin(rad) * rDot;
      const dotY = cy - Math.cos(rad) * rDot;

      // النقطة فقط (بدون خط أثر)
      rCtx.fillStyle = "#22c55e";
      rCtx.beginPath();
      rCtx.arc(dotX, dotY, 6.5, 0, Math.PI * 2);
      rCtx.fill();

      rCtx.strokeStyle = "#ffffff";
      rCtx.lineWidth = 1.8;
      rCtx.stroke();
    }

    function updateNavigationUI() {
      if (!currentPos || !activeTarget) return;

      const distM = distanceMeters(currentPos.lat, currentPos.lng, activeTarget.lat, activeTarget.lng);
      const bearing = calculateBearing(currentPos.lat, currentPos.lng, activeTarget.lat, activeTarget.lng);
      const roundedBearing = Math.round(bearing);

      navPanelEl.classList.add("show");
      directionBadgeEl.textContent = `الاتجاه: ${getCardinalArabic(bearing)}`;
      arrowIconEl.style.transform = `rotate(${roundedBearing}deg)`;
      targetNameEl.textContent = activeTarget.name;
      targetNoteEl.textContent = activeTarget.note || "";

      if (distM < 1000) {
        distanceValEl.textContent = `المسافة المباشرة: ${Math.round(distM)} م`;
      } else {
        distanceValEl.textContent = `المسافة المباشرة: ${(distM / 1000).toFixed(2)} كم`;
      }

      bearingValEl.textContent = `زاوية الاتجاه: ${roundedBearing}°`;
      drawRadarDotOnly(bearing, distM);

      if (distM <= 30) {
        alertBannerEl.classList.add("show");
        if (!arrivalAlertShown) {
          arrivalAlertShown = true;
          playArrivalBeep();
        }
      } else {
        alertBannerEl.classList.remove("show");
        arrivalAlertShown = false;
      }
    }

    function applyPosition(pos, isLive = false) {
      currentPos = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        heading: pos.coords.heading
      };

      currentCoordsEl.textContent = `${currentPos.lat.toFixed(5)}, ${currentPos.lng.toFixed(5)}`;
      gpsAccuracyEl.textContent = `الدقة: ±${Math.round(currentPos.accuracy || 0)} متر`;
      gpsStatusEl.textContent = isLive
        ? "تتبع حي نشط — يتحدث مع حركتك"
        : "تم تحديث الموقع بنجاح";

      updateNavigationUI();
    }

    function handleGpsError(err) {
      let msg = "تعذر قراءة موقع GPS";
      if (err && err.code === 1) msg = "تم رفض إذن الموقع — فعّلي الموقع من الإعدادات";
      else if (err && err.code === 2) msg = "إشارة الموقع غير متاحة حاليًا";
      else if (err && err.code === 3) msg = "انتهت مهلة قراءة الموقع";
      gpsStatusEl.textContent = msg;
    }

    function requestCurrentPosition(callback) {
      if (!navigator.geolocation) {
        gpsStatusEl.textContent = "المتصفح لا يدعم GPS";
        return;
      }
      gpsStatusEl.textContent = "جاري قراءة موقع GPS...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          applyPosition(pos, watchId !== null);
          if (typeof callback === "function") callback(currentPos);
        },
        handleGpsError,
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 3000 }
      );
    }

    btnUpdateGps.addEventListener("click", () => {
      requestCurrentPosition();
    });

    btnLiveTrack.addEventListener("click", () => {
      if (!navigator.geolocation) {
        gpsStatusEl.textContent = "المتصفح لا يدعم التتبع الحي";
        return;
      }

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        btnLiveTrack.textContent = "التتبع الحي عند الحركة: متوقف (اضغطي للتشغيل)";
        gpsStatusEl.textContent = "تم إيقاف التتبع الحي";
      } else {
        watchId = navigator.geolocation.watchPosition(
          (pos) => applyPosition(pos, true),
          handleGpsError,
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 2000 }
        );
        btnLiveTrack.textContent = "التتبع الحي عند الحركة: نشط (اضغطي للإيقاف)";
        gpsStatusEl.textContent = "تتبع حي نشط — يتحدث مع حركتك";
      }
    });

    function saveCarNow(posObj) {
      savedCar = {
        lat: posObj.lat,
        lng: posObj.lng,
        savedAt: Date.now()
      };
      persistSavedCar(savedCar);
      renderSavedCarStatus();
      gpsStatusEl.textContent = "تم حفظ موقع السيارة بنجاح";
    }

    btnSaveCar.addEventListener("click", () => {
      if (currentPos) {
        saveCarNow(currentPos);
      } else {
        requestCurrentPosition((posObj) => {
          if (posObj) saveCarNow(posObj);
        });
      }
    });

    btnGoCar.addEventListener("click", () => {
      if (!savedCar) {
        gpsStatusEl.textContent = "احفظي موقع السيارة أولًا قبل الضغط على العودة للسيارة";
        return;
      }
      activeTarget = {
        name: "موقع السيارة المحفوظ",
        note: "العودة المباشرة إلى السيارة",
        lat: savedCar.lat,
        lng: savedCar.lng
      };
      arrivalAlertShown = false;

      if (!currentPos) {
        requestCurrentPosition(() => updateNavigationUI());
      } else {
        updateNavigationUI();
      }
    });

    btnClearCar.addEventListener("click", () => {
      savedCar = null;
      try { localStorage.removeItem(STORAGE_KEY_CAR); } catch (e) {}
      renderSavedCarStatus();
      if (activeTarget && activeTarget.name === "موقع السيارة المحفوظ") {
        activeTarget = null;
        navPanelEl.classList.remove("show");
      }
      gpsStatusEl.textContent = "تم مسح موقع السيارة المحفوظ";
    });

    btnCopyCoords.addEventListener("click", async () => {
      const textToCopy = currentPos
        ? `${currentPos.lat.toFixed(6)}, ${currentPos.lng.toFixed(6)}`
        : (savedCar ? `${savedCar.lat.toFixed(6)}, ${savedCar.lng.toFixed(6)}` : "");
      if (!textToCopy) {
        gpsStatusEl.textContent = "لا توجد إحداثيات للنسخ بعد";
        return;
      }
      try {
        await navigator.clipboard.writeText(textToCopy);
        gpsStatusEl.textContent = `تم نسخ الإحداثيات: ${textToCopy}`;
      } catch (e) {
        gpsStatusEl.textContent = `الإحداثيات: ${textToCopy}`;
      }
    });

    document.querySelectorAll("[data-preset]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.getAttribute("data-preset");
        const p = PRESETS[key];
        if (!p) return;
        activeTarget = { ...p };
        arrivalAlertShown = false;
        if (!currentPos) {
          requestCurrentPosition(() => updateNavigationUI());
        } else {
          updateNavigationUI();
        }
      });
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }

    renderSavedCarStatus();
  </script>
</body>
</html>
